[tool.poetry]
name = "mo_arbor"
version = "0.0.0"  # versioning handled by conventional commits
description = "OS2mo integration that syncs organisation units from CSV files, such as SOR and Økosted"
authors = ["Magenta ApS <info@magenta.dk>"]
license = "MPL-2.0"

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^1"
structlog = "^25"
uvicorn = "^0.34"
fastramqpi = "^17"
fastapi = "^0.115.0"
more-itertools = "^10"
python-stdnum = "^2"
async-lru = "^2"

[tool.poetry.group.pre-commit.dependencies]
mypy = "^2"
pre-commit = "^4"
ruff = "^0.16"
deptry = "^0.25"

[tool.poetry.group.test.dependencies]
pytest = "^8.4"
pytest-asyncio = "^1.4"
pytest-cov = "^5"
pytest-split = "^0.9"
asgi-lifespan = "^2.1.0"

[tool.poetry.group.dev.dependencies]
ariadne-codegen = "0.7.1"
websockets = "^13.0.1"  # for ariadne

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
plugins = "pydantic.mypy"

[tool.ariadne-codegen]
target_package_name = "autogenerated_graphql_client"
target_package_path = "mo_arbor/"
client_name = "GraphQLClient"
schema_path = "schema.graphql"  # curl -O http://localhost:5000/graphql/v30/schema.graphql
queries_path = "queries.graphql"
include_all_inputs = false
include_all_enums = false
plugins = [
    "ariadne_codegen.contrib.shorter_results.ShorterResultsPlugin",
    "fastramqpi.ariadne.UnsetInputTypesPlugin",
    # Forbid extra fields on the generated BaseModel so typos raise an exception
    "fastramqpi.ariadne.ForbidExtraBaseModelPlugin",
]
include_comments = false
[tool.ariadne-codegen.scalars.DateTime]
type = "datetime.datetime"
parse = "fastramqpi.ariadne.parse_graphql_datetime"
[tool.ariadne-codegen.scalars.UUID]
type = "uuid.UUID"

[tool.coverage.report]
omit = [
  "mo_arbor/autogenerated_graphql_client/*",
]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
"mo_arbor/autogenerated_graphql_client/*" = ["PYI019", "RUF015"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.deptry]
extend_exclude = [
  "mo_arbor/autogenerated_graphql_client/*",
]
[tool.deptry.per_rule_ignores]
DEP002 = [
  # uvicorn is used by the Dockerfile
  "uvicorn",
]
