---
services:
  mo-arbor:
    build: .
    command: ["uvicorn", "--factory", "mo_arbor.app:create_app", "--host", "0.0.0.0", "--reload"]
    environment:
      FASTRAMQPI__LOG_LEVEL: "INFO"
      FASTRAMQPI__JSON_LOGS: "false"

      # OS2mo
      FASTRAMQPI__MO_URL: "http://mo:5000"
      FASTRAMQPI__CLIENT_ID: "dipex"
      FASTRAMQPI__CLIENT_SECRET: "603f1c82-d012-4d04-9382-dbe659c533fb"
      FASTRAMQPI__AUTH_SERVER: "http://keycloak:8080/auth"
      FASTRAMQPI__AUTH_REALM: "mo"
      # The MO AMQP system is no longer used for events (replaced by the GraphQL
      # event system), but FastRAMQPI's integration-test fixtures still require
      # AMQP connection settings to be present.
      FASTRAMQPI__AMQP__URL: "amqp://guest:guest@msg-broker:5672/"

      CODE_SYSTEMS: '[{"name": "sor", "file_pattern": "region_sor_%Y%m%d_%H%M%S.csv", "uuid_namespace": "sor.dk"}, {"name": "okosted", "file_pattern": "region_okosted_%Y%m%d_%H%M%S.csv", "uuid_namespace": "okosted"}]'

      # Database
      FASTRAMQPI__DATABASE__USER: "fastramqpi"
      FASTRAMQPI__DATABASE__PASSWORD: "fastramqpi"
      FASTRAMQPI__DATABASE__HOST: "db"
      FASTRAMQPI__DATABASE__NAME: "fastramqpi"

    networks:
      - default
      - os2mo_default
    volumes:
      - ./mo_arbor/:/app/mo_arbor/:ro
      - ./tests/:/app/tests/:ro
    tmpfs:
      - /app/.pytest_cache/
    ports:
      - 127.0.0.1:8000:8000
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: "fastramqpi"
      POSTGRES_PASSWORD: "fastramqpi"
      POSTGRES_DB: "fastramqpi"
    networks:
      - default

networks:
  os2mo_default:
    external: true
